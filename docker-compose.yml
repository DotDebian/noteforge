services:
  noteforge:
    build: .
    image: noteforge:latest
    container_name: noteforge
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      # Required — fail fast if either is missing (Nuxt/auth-utils throws on
      # an empty NUXT_SESSION_PASSWORD; Mistral calls 401 without the key).
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?NUXT_SESSION_PASSWORD is required (>= 32 chars)}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-medium-latest}
      MISTRAL_EMBED_MODEL: ${MISTRAL_EMBED_MODEL:-mistral-embed}
      # Optional — powers the chat's `web_search` tool. Left empty disables web
      # search gracefully (the tool isn't offered, chat still answers from notes).
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DATABASE_URL: /app/data/noteforge.db
    volumes:
      # Bind-mount the host's data/ directory so the SQLite DB + WAL files
      # survive `docker compose down` and are easy to back up.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
